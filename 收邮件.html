<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>邮箱收件箱</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182230;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:40px auto}.card{padding:26px;background:#fff;border:1px solid #e1e6ec;border-radius:15px;box-shadow:0 12px 32px #18223012}h1{margin:0 0 6px;font-size:25px}.account{color:#718096;font-size:13px}.status{margin-top:18px;padding:12px;border-radius:8px;background:#eef4ff;color:#285da8;font-size:13px}.status.error{background:#fff0f0;color:#c43d3d}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.refresh{padding:9px 14px;border:0;border-radius:8px;background:#246bfd;color:#fff;font-weight:700}.mail{padding:18px 0;border-top:1px solid #e7ebf0}.mail:first-child{margin-top:8px}.subject{font-weight:700;font-size:15px}.meta{margin-top:5px;color:#7b8797;font-size:11px}.body{margin-top:11px;padding:13px;border-radius:9px;background:#f6f8fa;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65}@media(max-width:500px){.wrap{margin:20px auto}.card{padding:20px}}
    .body a{color:#1769e0;text-decoration:underline;cursor:pointer}.body img{max-width:100%;height:auto}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>邮箱收件箱</h1>
      <div id="account" class="account"></div>
      <div class="toolbar"><strong>邮件列表</strong><button id="refresh" class="refresh" type="button">刷新邮件</button></div>
      <div id="status" class="status">正在查询邮件…</div>
      <div id="letters"></div>
    </section>
  </main>
  <script>
    const API_TOKEN = 'aKzyZNYjCC6KRNyitkz2m7Kv2SdwsCCb';
    const params = new URLSearchParams(location.search);
    const email = params.get('email') || '';
    const password = params.get('password') || '';
    const token = params.get('token') || API_TOKEN;
    const statusBox = document.getElementById('status');
    const lettersBox = document.getElementById('letters');
    document.getElementById('account').textContent = email || '未指定邮箱';

    function escapeHtml(text) {
      return String(text ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function safeMailHtml(html, text) {
      if (!html) {
        return escapeHtml(text || '').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      }
      const doc = new DOMParser().parseFromString(String(html), 'text/html');
      doc.querySelectorAll('script,iframe,object,embed,form,meta,base').forEach(node => node.remove());
      doc.querySelectorAll('*').forEach(node => {
        [...node.attributes].forEach(attribute => {
          const name = attribute.name.toLowerCase();
          const value = attribute.value.trim();
          if (name.startsWith('on') || name === 'srcdoc') node.removeAttribute(attribute.name);
          if ((name === 'href' || name === 'src') && !/^(https?:|mailto:|cid:|data:image\/)/i.test(value)) node.removeAttribute(attribute.name);
        });
      });
      doc.querySelectorAll('a[href]').forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      });
      return doc.body.innerHTML;
    }

    function apiError(data, fallback) {
      if (typeof data === 'string') return data || fallback;
      return data?.message || data?.error || data?.detail || (typeof data?.data === 'string' ? data.data : fallback);
    }

    async function loadLetters() {
      if (!email || !password || !token) {
        statusBox.textContent = '链接缺少邮箱、密码或 API Token';
        statusBox.className = 'status error';
        return;
      }
      statusBox.textContent = '正在查询邮件…'; statusBox.className = 'status';
      lettersBox.innerHTML = '';
      document.getElementById('refresh').disabled = true;
      try {
        const response = await fetch('https://api.notletters.com/v1/letters', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const text = await response.text();
        let data = text;
        try { data = JSON.parse(text); } catch (_) {}
        if (!response.ok) throw new Error(apiError(data, '查询失败（' + response.status + '）'));
        const letters = data?.data?.letters || data?.letters;
        if (!Array.isArray(letters)) throw new Error(apiError(data, '接口返回的邮件格式不正确'));
        statusBox.textContent = letters.length ? '共查询到 ' + letters.length + ' 封邮件' : '邮箱中暂时没有邮件';
        lettersBox.innerHTML = letters.map(letter => {
          const date = letter.date ? new Date(Number(letter.date) * 1000).toLocaleString() : '';
          const content = safeMailHtml(letter.letter?.html, letter.letter?.text);
          return '<article class="mail"><div class="subject">' + escapeHtml(letter.subject || '无标题') + '</div>' +
            '<div class="meta">发件人：' + escapeHtml(letter.sender_name || letter.sender || '未知') + (date ? ' · ' + escapeHtml(date) : '') + '</div>' +
            '<div class="body">' + content + '</div></article>';
        }).join('');
      } catch (error) {
        statusBox.textContent = error instanceof TypeError ? '浏览器阻止了跨域请求，请确认 API 允许网页直接访问' : error.message;
        statusBox.className = 'status error';
      } finally {
        document.getElementById('refresh').disabled = false;
      }
    }

    document.getElementById('refresh').onclick = loadLetters;
    loadLetters();
  </script>
</body>
</html>
